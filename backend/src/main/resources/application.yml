spring:
  application:
    name: genealogy-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/genealogy?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: ${FLYWAY_REPAIR_ON_MIGRATE:false}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  codec:
    max-in-memory-size: 100MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  tomcat:
    max-swallow-size: 500MB
    max-http-form-post-size: 500MB
  max-http-request-header-size: 64KB

app:
  jwt:
    secret: ${JWT_SECRET:}
    # Local development only: an unset secret creates a random key for this process.
    # Production overrides this to false, so JWT_SECRET remains mandatory there.
    allow-ephemeral-secret: ${JWT_ALLOW_EPHEMERAL_SECRET:true}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:900000}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:2592000000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  secure-cookie: ${APP_SECURE_COOKIE:false}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_SIZE_BYTES:26214400}
  photo:
    max-file-size-bytes: ${APP_PHOTO_MAX_FILE_SIZE_BYTES:10485760}
  backup:
    max-restore-size-bytes: ${APP_BACKUP_MAX_RESTORE_SIZE_BYTES:524288000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
