name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the production server
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}-backend
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: release/backend.Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: release/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (optional)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu

            compose() {
              docker compose --env-file release/.env -f release/docker-compose.deploy.yml "$@"
            }

            wait_for_healthy() {
              container="$1"
              for attempt in $(seq 1 36); do
                status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container" 2>/dev/null || true)"
                if [ "$status" = "healthy" ]; then
                  echo "$container is healthy"
                  return 0
                fi
                if [ "$status" = "unhealthy" ]; then
                  echo "$container is unhealthy"
                  return 1
                fi
                echo "Waiting for $container health ($attempt/36): $status"
                sleep 5
              done
              echo "$container did not become healthy"
              return 1
            }

            previous_backend="$(docker inspect --format '{{.Config.Image}}' guiyuan-backend 2>/dev/null || true)"
            previous_frontend="$(docker inspect --format '{{.Config.Image}}' guiyuan-frontend 2>/dev/null || true)"

            rollback() {
              trap - ERR
              if [ -z "$previous_backend" ] || [ -z "$previous_frontend" ]; then
                echo "No previous release is available for rollback"
                exit 1
              fi
              echo "Deployment failed; rolling back to $previous_backend and $previous_frontend"
              export BACKEND_IMAGE="$previous_backend"
              export FRONTEND_IMAGE="$previous_frontend"
              compose up -d --remove-orphans
              wait_for_healthy guiyuan-backend
              wait_for_healthy guiyuan-frontend
            }

            trap rollback ERR
            cd "${{ secrets.DEPLOY_PATH || '/opt/guiyuan' }}"
            export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            compose pull
            compose up -d --remove-orphans
            wait_for_healthy guiyuan-backend
            wait_for_healthy guiyuan-frontend
            trap - ERR
            echo "Deployment ${{ github.sha }} is healthy"
